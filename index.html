    <style>
        @import "tailwindcss";

        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e293b;
            --bg-content: #F8FAFC;
        }

        .dark {
            --bg-content: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-content);
            transition: background-color 0.3s ease;
        }

        .sidebar-active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.2);
        }

        /* Dolphin Easter Egg */
        .btn-ai-dolphin:hover::after {
            content: '🐬';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            animation: dolphinJump 0.6s ease-out infinite alternate;
            font-size: 1.2rem;
        }

        @keyframes dolphinJump {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-80%) rotate(-20deg); }
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.95);
        }

        .btn-secondary {
            @apply bg-slate-100 text-slate-600 font-bold transition-all;
        }

        .btn-secondary:hover:not(:disabled) {
            @apply bg-slate-200 text-slate-900;
        }

        .input-premium {
            @apply w-full px-5 py-3 rounded-[8px] border border-slate-200 bg-white transition-all outline-none text-slate-900;
            min-height: 48px;
        }

        .input-premium:focus {
            @apply ring-2 ring-blue-500 border-transparent shadow-lg shadow-blue-500/5;
        }

        .card-premium {
            @apply bg-white border border-[#E2E8F0] rounded-[14px] shadow-sm transition-all duration-300;
        }

        .card-premium:hover {
            @apply shadow-md border-slate-300;
        }

        /* Status Badges Refined */
        .badge-status {
            @apply px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border;
        }
        .badge-urgent { @apply bg-rose-100 text-rose-900 border-rose-200; }
        .badge-pending { @apply bg-amber-100 text-amber-900 border-amber-200; }
        .badge-resolved { @apply bg-emerald-100 text-emerald-900 border-emerald-200; }
        .badge-analysis { @apply bg-blue-100 text-blue-900 border-blue-200; }

        /* Dark Mode Overrides */
        .dark .card-premium {
            background-color: var(--card-bg);
            border-color: var(--border-color);
            color: var(--text-main);
        }
        .dark .text-slate-900 { color: #f8fafc; }
        .dark .text-slate-600 { color: #94a3b8; }
        .dark .bg-white { background-color: var(--card-bg); }
        .dark .bg-slate-50 { background-color: #0f172a; }

        /* Layout Helpers */
        .content-container {
            @apply max-w-7xl mx-auto w-full px-6 py-8;
        }

        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Custom Progress Bar */
        progress {
            border-radius: 999px;
            width: 100%;
            height: 8px;
            overflow: hidden;
        }
        progress::-webkit-progress-bar {
            background-color: #f1f5f9;
        }
        progress::-webkit-progress-value {
            background-color: var(--primary-color);
            border-radius: 999px;
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid #fff;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .animate-slide-in-right {
            animation: slide-in-right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fill-width {
            from { width: 0; }
            to { width: 85%; }
        }
        .animate-fill-width {
            animation: fill-width 2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                // New style: white background, soft green border for success
                const borderColor = type === 'success' ? 'border-emerald-100' : 'border-rose-100';
                const iconColor = type === 'success' ? 'text-emerald-500' : 'text-rose-500';
                const icon = type === 'success' ? 'check' : 'alert-circle';
                
                toast.className = `toast pointer-events-auto flex items-center gap-4 px-6 py-5 rounded-2xl bg-white border ${borderColor} shadow-2xl transition-all duration-300 transform translate-x-10 opacity-0`;
                toast.innerHTML = `
                    <div class="w-8 h-8 rounded-full ${type === 'success' ? 'bg-emerald-50' : 'bg-rose-50'} flex items-center justify-center ${iconColor}">
                        <i data-lucide="${icon}" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-slate-900 text-sm">${message}</span>
                `;
                
                container.appendChild(toast);
                lucide.createIcons();
                
                // Animate in
                requestAnimationFrame(() => {
                    toast.classList.remove('translate-x-10', 'opacity-0');
                    toast.classList.add('translate-x-0', 'opacity-100');
                });
                
                setTimeout(() => {
                    toast.classList.add('translate-x-10', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);

                modal.id = 'approval-modal';
                modal.className = 'fixed inset-0 z-[10001] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-sm animate-in fade-in duration-300';
                modal.innerHTML = `
                    <div class="w-full max-w-xl bg-white rounded-[2.5rem] shadow-2xl p-12 space-y-10 animate-in zoom-in-95 duration-300">
                        <div class="flex justify-between items-start">

                            </div>
                            <button onclick="document.getElementById('approval-modal').remove()" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                                <i data-lucide="x" class="w-6 h-6 text-slate-400"></i>
                            </button>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">E-mail do Cliente ou Diretor</label>
                                <input type="email" id="approval-email" placeholder="aprovador@cliente.com" class="input-premium">
                            </div>
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Mensagem ao aprovador (Opcional)</label>
                                <textarea id="approval-msg" class="input-premium h-32 resize-none" placeholder="Olá, segue o material para sua revisão estratégica..."></textarea>
                            </div>
                        </div>

                        <button id="send-approval-btn" class="w-full btn-primary py-6 rounded-2xl font-black text-xl flex items-center justify-center gap-4">
                            <i data-lucide="link" class="w-5 h-5"></i>
                            <span>Gerar Link Seguro e Enviar</span>
                        </button>
                    </div>
                `;
                document.body.appendChild(modal);
                lucide.createIcons();

                document.getElementById('send-approval-btn').addEventListener('click', async (e) => {
                    const btn = e.currentTarget;
                    const span = btn.querySelector('span');
                    btn.disabled = true;
                    span.innerHTML = '<div class="spinner"></div>';

                    await new Promise(r => setTimeout(r, 1500));
                    
                    this.showToast('Link de aprovação enviado com sucesso!');
                    modal.remove();

            attachTabEvents() {
                if (this.userRole === 'super_admin') {
                    document.getElementById('save-portal-btn')?.addEventListener('click', async (e) => {
                        const btn = e.currentTarget;
                        const span = btn.querySelector('span');
                        const originalText = span.innerText;
                        
                        span.innerHTML = '<div class="spinner"></div>';
                        btn.disabled = true;

                        await new Promise(r => setTimeout(r, 1500));

                        this.landingPageConfig = {
                            heroTitle: document.getElementById('portal-hero-title').value,
                            heroSubtitle: document.getElementById('portal-hero-subtitle').value,
                            contactEmail: document.getElementById('portal-contact-email').value
                        };

                        localStorage.setItem('uniRP_landing_config', JSON.stringify(this.landingPageConfig));
                        
                        span.innerText = originalText;
                        btn.disabled = false;
                        this.showToast('Portal Público atualizado com sucesso!');
                    });
                    return;
                }

                if (this.currentTab === 'hub') {
                    if (this.hubView === 'initial') {
                        document.getElementById('hub-generate-btn')?.addEventListener('click', async (e) => {
                            const btn = e.currentTarget;
                            const span = btn.querySelector('span');
                            const briefing = document.getElementById('hub-briefing').value;
                            const formato = document.getElementById('hub-formato').value;

                            if (!briefing) {
                                this.showToast('Por favor, insira o briefing estratégico.', 'error');
                                return;
                            }

                            btn.disabled = true;
                            span.innerHTML = '<div class="spinner"></div>';

                            // Simula IA
                            await new Promise(r => setTimeout(r, 2000));

                            this.hubData.formato = formato;
                            this.hubData.briefing = briefing;
                            this.hubData.generatedText = this.getMockGeneratedText(formato);
                            this.hubView = 'editing';
                            this.renderLayout();
                        });
                    }

                    if (this.hubView === 'distributing') {
                        document.getElementById('execute-dispatch-btn')?.addEventListener('click', async (e) => {
                            const btn = e.currentTarget;
                            const bar = document.getElementById('dispatch-progress-bar');
                            const content = document.getElementById('dispatch-btn-content');
                            
                            btn.disabled = true;
                            content.innerHTML = '<i data-lucide="loader" class="w-6 h-6 animate-spin"></i><span>Processando Disparo...</span>';
                            lucide.createIcons();

                            // Simula Progresso
                            bar.style.transform = 'scaleX(1)';
                            
                            await new Promise(r => setTimeout(r, 2000));

                            this.showToast('Campanha no ar! Disparos realizados com sucesso.');
                            this.currentTab = 'dashboard';
                            this.hubView = 'initial';
                            this.renderLayout();
                        });
                    }
                }

                if (this.currentTab === 'endo' && this.endoView === 'comunicados') {
                    document.getElementById('send-endo-btn')?.addEventListener('click', () => this.sendEndoAction());
                }

                if (this.currentTab === 'brain') {
                    document.getElementById('save-brain-btn')?.addEventListener('click', async (e) => {
                        const btn = e.currentTarget;
                        const span = btn.querySelector('span');
                        
                        // Validação Básica
                        const required = ['gemini_key', 'inst_nome'];
                        for (const id of required) {
                            const el = document.getElementById(id);
                            if (el && !el.value) {
                                this.showToast(`O campo ${id} é obrigatório`, 'error');
                                return;
                            }
                        }

                        btn.disabled = true;
                        span.innerHTML = '<div class="spinner"></div>';

                        // Simula Processamento
                        await new Promise(r => setTimeout(r, 2000));

                        // Coleta Dados Gerais (Engenharia e White-Label)
                        const generalFields = [
                            'gemini_key', 'supabase_url', 'supabase_key', 
                            'smtp_host', 'smtp_port', 'smtp_user', 'smtp_pass',
                            'inst_nome', 'inst_logo', 'color_primary', 'color_secondary'
                        ];

                        generalFields.forEach(f => {
                            const el = document.getElementById(f);
                            if (el) this.config[f] = el.value;
                        });

                        // Coleta Dados do Núcleo (Condicional)
                        const perfilAtivo = localStorage.getItem('unirp_perfil_ativo') || 'Órgão Público';
                        const dadosNucleo = {};
                        
                        if (perfilAtivo === 'Gabinete Digital') {
                            const nucleoFields = ['bandeiras', 'espectro', 'linhas_vermelhas', 'tom_voz_politico'];
                            nucleoFields.forEach(f => {
                                const el = document.getElementById(f);
                                if (el) dadosNucleo[f] = el.value;
                            });
                        } else {
                            const nucleoFields = ['missao', 'visao', 'valores', 'historico', 'tom_voz'];
                            nucleoFields.forEach(f => {
                                const el = document.getElementById(f);
                                if (el) {
                                    dadosNucleo[f] = el.value;
                                    // Também atualiza this.config para manter compatibilidade com o formulário padrão
                                    this.config[f] = el.value;
                                }
                            });
                        }

                        localStorage.setItem('uniRP_config', JSON.stringify(this.config));
                        localStorage.setItem('unirp_dados_nucleo', JSON.stringify(dadosNucleo));
                        
                        // Atualiza Perfil Mock se estiver em Bypass
                        if (this.isBypassMode) {
                            this.userProfile.instituicoes.nome = this.config.inst_nome;
                            this.userProfile.instituicoes.logo_url = this.config.inst_logo;
                            this.userProfile.instituicoes.cor_primaria = this.config.color_primary;
                            this.userProfile.instituicoes.cor_secundaria = this.config.color_secondary;
                        }

                        this.showToast("Configurações salvas e conexões validadas com sucesso!");
                        
                        btn.disabled = false;
                        span.innerText = 'Salvar Configurações e Testar Conexões';
                        
                        // Re-render para aplicar mudanças visuais
                        this.renderLayout();
                    });

                    document.getElementById('save-portal-btn')?.addEventListener('click', async (e) => {
                        const btn = e.currentTarget;
                        const span = btn.querySelector('span');
                        
                        btn.disabled = true;
                        span.innerHTML = '<div class="spinner"></div>';

                        // Simula Processamento
                        await new Promise(r => setTimeout(r, 1500));

                        // Coleta Dados
                        this.landingPageConfig.heroTitle = document.getElementById('portal-hero-title').value;
                        this.landingPageConfig.heroSubtitle = document.getElementById('portal-hero-subtitle').value;
                        this.landingPageConfig.contactEmail = document.getElementById('portal-contact-email').value;

                        localStorage.setItem('uniRP_landing_config', JSON.stringify(this.landingPageConfig));

                        this.showToast("Portal Público atualizado com sucesso!");
                        
                        btn.disabled = false;
                        span.innerText = 'Salvar Alterações do Portal';
                    });
                }

                if (this.currentTab === 'press') {
                    const uploadZone = document.getElementById('press-upload-zone');
                    const fileInput = document.getElementById('press-file-input');

                    if (uploadZone && fileInput) {
                        uploadZone.addEventListener('click', () => fileInput.click());
                        
                        fileInput.addEventListener('change', (e) => {
                            this.simulatePressUpload(e.target.files);
                        });

                        // Drag and Drop
                        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                            uploadZone.addEventListener(eventName, (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                            }, false);
                        });

                        ['dragenter', 'dragover'].forEach(eventName => {
                            uploadZone.addEventListener(eventName, () => {
                                uploadZone.classList.add('border-blue-600', 'bg-blue-50/50');
                            }, false);
                        });

                        ['dragleave', 'drop'].forEach(eventName => {
                            uploadZone.addEventListener(eventName, () => {
                                uploadZone.classList.remove('border-blue-600', 'bg-blue-50/50');
                            }, false);
                        });

                        uploadZone.addEventListener('drop', (e) => {
                            const dt = e.dataTransfer;
                            const files = dt.files;
                            this.simulatePressUpload(files);
                        }, false);
                    }
                }

                if (this.currentTab === 'planning') {
                    document.getElementById('generate-plan-btn')?.addEventListener('click', () => this.generatePlanningAction());
                }

                if (this.currentTab === 'clipping') {
                    document.getElementById('clipping-search')?.addEventListener('input', (e) => {
                        this.clippingData.searchQuery = e.target.value;
                    });
                }

                const col = this.workflowData.columns.find(c => c.id === id);

                    col.title = newTitle;

                    this.renderLayout();
                }
            },

            toggleCardSelection(id) {
                const index = this.workflowData.selectedCards.indexOf(id);
                if (index === -1) {
                    this.workflowData.selectedCards.push(id);
                } else {
                    this.workflowData.selectedCards.splice(index, 1);
                }
                this.updateBatchBar();
                this.renderLayout();
            },

            updateBatchBar() {
                const bar = document.getElementById('workflow-batch-bar');
                const count = document.getElementById('selected-count');
                if (this.workflowData.selectedCards.length > 0) {
                    bar?.classList.remove('hidden');
                    if (count) count.innerText = this.workflowData.selectedCards.length;
                } else {
                    bar?.classList.add('hidden');
                }
            },

            clearCardSelection() {
                this.workflowData.selectedCards = [];
                this.updateBatchBar();
                this.renderLayout();
            },

            async executeBatchAction(action) {
                if (action === 'delete') {
                    if (confirm(`Deseja deletar ${this.workflowData.selectedCards.length} cards?`)) {
                        try {
                            const { error } = await supabase
                                .from('workflow_kanban')
                                .delete()
                                .in('id', this.workflowData.selectedCards);

                            if (error) throw error;
                            this.showToast('Cards deletados com sucesso');
                            this.fetchWorkflowCards();
                        } catch (error) {
                            console.error("Erro ao deletar cards:", error);
                            this.showToast('Erro ao deletar cards do banco.', 'error');
                        }
                    }
                } else if (action === 'move') {
                    const colId = prompt('Mover para qual coluna? (pautas, producao, revisao, concluido)');
                    if (this.workflowData.columns.some(c => c.id === colId)) {
                        try {
                            const { error } = await supabase
                                .from('workflow_kanban')
                                .update({ coluna_id: colId })
                                .in('id', this.workflowData.selectedCards);

                            if (error) throw error;
                            this.showToast('Cards movidos com sucesso');
                            this.fetchWorkflowCards();
                        } catch (error) {
                            console.error("Erro ao mover cards:", error);
                            this.showToast('Erro ao mover cards no banco.', 'error');
                        }
                    }
                }
                this.workflowData.selectedCards = [];
                this.updateBatchBar();
                this.renderLayout();
            },

            async processMeeting() {
                const processing = document.getElementById('meeting-processing');
                const stepText = document.getElementById('processing-step');
                const bar = document.getElementById('processing-bar');
                const percent = document.getElementById('processing-percent');

                processing.classList.remove('hidden');
                processing.scrollIntoView({ behavior: 'smooth' });

                const steps = [
                    { text: 'Transcrevendo Áudio...', time: 2000 },
                    { text: 'Identificando Oradores...', time: 1500 },
                    { text: 'Extraindo Insights Estratégicos...', time: 2000 }
                ];

                let currentProgress = 0;
                for (let i = 0; i < steps.length; i++) {
                    stepText.innerText = steps[i].text;
                    const increment = 100 / steps.length;
                    const target = (i + 1) * increment;
                    
                    while (currentProgress < target) {
                        currentProgress += 1;
                        bar.style.width = `${currentProgress}%`;
                        percent.innerText = `${Math.round(currentProgress)}%`;
                        await new Promise(r => setTimeout(r, steps[i].time / increment));
                    }
                }

                this.showMeetingResult();
            },

                        <div class="flex justify-between items-start">

                            <button onclick="document.getElementById('add-contact-modal').remove()" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">

                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest">Veículo / Empresa</label>

                            <div>

                                <input type="text" name="editoria" required class="input-premium" placeholder="Ex: Tecnologia">

                            <div>

                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest">Status LGPD</label>
                                <select name="status" class="input-premium">

                                <button type="submit" class="w-full btn-primary py-6 rounded-2xl font-black text-xl flex items-center justify-center gap-4">
                                    <span>Salvar Contato no Banco</span>

                            </div>
                        </form>
                    </div>
                `;
                document.body.appendChild(modal);
                lucide.createIcons();

                document.getElementById('add-contact-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const contact = Object.fromEntries(formData.entries());
                    
                    const btn = e.target.querySelector('button[type="submit"]');
                    const span = btn.querySelector('span');
                    btn.disabled = true;
                    span.innerHTML = '<div class="spinner"></div>';

                    try {
                        const { error } = await supabase
                            .from('crm_contatos')
                            .insert([contact]);

                        if (error) throw error;

                        this.showToast('Contato salvo com sucesso!');
                        modal.remove();
                        this.fetchCRMContacts();
                    } catch (error) {
                        console.error("Erro ao salvar contato:", error);
                        this.showToast('Erro ao salvar no banco.', 'error');
                        btn.disabled = false;
                        span.innerText = 'Salvar Contato no Banco';

                });

            handleDragStart(e, cardId) {
                e.dataTransfer.setData('cardId', cardId);
                e.currentTarget.classList.add('opacity-50');
            },

            handleDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add('border-blue-400', 'bg-blue-50/30');
            },

            handleDragLeave(e) {
                e.currentTarget.classList.remove('border-blue-400', 'bg-blue-50/30');
            },

            async handleDrop(e, columnId) {
                e.preventDefault();
                e.currentTarget.classList.remove('border-blue-400', 'bg-blue-50/30');
                const cardId = e.dataTransfer.getData('cardId');
                
                const card = this.workflowData.cards.find(c => c.id == cardId);
                if (card && card.columnId !== columnId) {
                    const oldColumnId = card.columnId;
                    card.columnId = columnId;
                    this.renderLayout();

                    try {
                        const { error } = await supabase
                            .from('workflow_kanban')
                            .update({ coluna_id: columnId })
                            .eq('id', cardId);

                        if (error) throw error;
                        this.showToast(`Card movido para ${columnId}`);
                    } catch (error) {
                        console.error("Erro ao mover card:", error);
                        this.showToast('Erro ao sincronizar movimento.', 'error');
                        card.columnId = oldColumnId;
                        this.renderLayout();
                    }
                }
            },

                    const btn = e.target.querySelector('button[type="submit"]');

                    try {
                        const newCard = {

                            coluna_id: data.coluna_id,

                        const { error } = await supabase
                            .from('workflow_kanban')
